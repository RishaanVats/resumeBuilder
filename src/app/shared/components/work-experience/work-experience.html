<div class="form-container my-5">
    <h2>Work Experience</h2>
    <form [formGroup]="workExperience" (ngSubmit)="goNext()">
        <div class="form-row">
            <div class="form-group">
                <label class="required" for="jobTitle">Job Title:</label>
                <input type="text" id="jobTitle" formControlName="jobTitle" placeholder="Enter your Job Title" />
            </div>
        </div>
        <hr>
        <div class="form-row">
            <div class="form-group">
                <label class="required" for="companyName">Copmpany:</label>
                <input type="text" id="companyName" formControlName="companyName"
                    placeholder="Enter name of the Company" />
            </div>
            <div class="form-group">
                <label class="required" for="startDate">Start Date:</label>
                <input type="date" id="startDate" formControlName="startDate" />
            </div>
            <div class="form-group">
                <label class="" for="endDate">End Date:</label>
                <input type="date" id="endDate" formControlName="endDate" />
            </div>
        </div>
        <div class="form-row">
            <div class="align-content-center fs-6">
                <input class="me-2" type="checkbox" id="currentlyWorking" formControlName="currentlyWorking" />
                <label for="currentlyWorking">Currently working here.</label>
            </div>
        </div>
        <hr>
        <div class="form-row">
            <div class="form-group">
                <label for="location">Location:</label>
                <input type="text" id="location" formControlName="location" />
            </div>
            <div class="form-group">
                <label for="employmentType">Employment Type:</label>
                <select formControlName="employmentType" id="employmentType">
                    @for(type of employmentType; track $index){
                    <option value={{type}}>{{type}}</option>
                    }
                </select>
            </div>
            <div class="form-group">
                <label for="workType">Work Type:</label>
                <select formControlName="workType" id="workType">
                    @for(type of workType; track $index){
                    <option value={{type}}>{{type}}</option>
                    }
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="jobDescription">Job Description:</label>
                <textarea id="jobDescription" formControlName="jobDescription" rows="5" placeholder="Enter your job's description"></textarea>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="responsibilities">Responsibilities:</label>
                <textarea id="responsibilities" formControlName="responsibilities" rows="5" placeholder="Enter your responsibilites"></textarea>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="keyProjects">Key Projects:</label>
                <textarea id="keyProjects" formControlName="keyProjects" rows="5" placeholder="Enter your key projects"></textarea>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="responsibilities">Responsibilities:</label>
                <textarea id="responsibilities" formControlName="responsibilities" rows="5" placeholder="Enter your responsibilities"></textarea>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="technologiesUsed">Technologies Used:</label>
                <textarea id="technologiesUsed" formControlName="technologiesUsed" rows="5" placeholder="Enter the technnologies used"></textarea>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="customInformation">Additional Information:</label>
                <textarea id="customInformation" formControlName="customInformation" rows="5" placeholder="Enter any other relevant information (optional)"></textarea>
            </div>
        </div>
        <div class="btn-container mt-4">
            <button class="previous-btn" type="button" (click)="goPrevious()">Previous</button>
            <button class="next-btn" type="submit" [disabled]="!workExperience.valid">Next</button>
        </div>
    </form>
</div>
